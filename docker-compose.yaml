services:
  postgres:
    image: postgres:18-alpine
    container_name: grocery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - grocery-db-data:/var/lib/postgresql

volumes:
  grocery-db-data: